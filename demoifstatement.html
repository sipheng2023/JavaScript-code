<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript page</title>
</head>
<body>
    <h1>IF Statement</h1>
    <script language="javascript" type ="text/javascript">
        // ການກວດເງື່ອນໄຂ: if else if else
        /* .... start code for Javascript 
          by beit 2027 ....*/
        let score = 97;
        if (score >= 90) {
            document.write("Grade: A");
        } else if (score >= 80) {
            document.write("Grade: B");
        } else if (score >= 70) {
            document.write("Grade: C");
        } else if (score >= 60) {
            document.write("Grade: D");
        } else {
            document.write("Grade: F");
        }
        /* .... ``````end code for Javascript 
          by beit 2027`````` ....*/

          // ການກວດເງື່ອນໄຂ: if else if else
        /* .... start code for Javascript 
          by beit 2027 ....*/
        let age = 75;
        if (age < 18) {
            document.write("<p>You are a minor.</p>");
        } else if (age >= 18 && age < 65) {
            document.write("<p>You are an adult.</p>");
        } else {
            document.write("<p>You are a senior citizen.</p>");
        }

    </script>
</body>
</html>
